version: "3.9"

services:
  platform-osint:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: platforme-osint
    ports:
      - "5000:5000"
      - "8080:8080"
    environment:
      - PLATFORM_HOST=0.0.0.0
      - PLATFORM_PORT=5000
      - OPENAI_API_BASE=${OPENAI_API_BASE:-http://127.0.0.1:11434/v1}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-ollama}
      - HERMES_MODEL=${HERMES_MODEL:-hermes-3-8b}
      - OPENCLAW_GATEWAY_URL=${OPENCLAW_GATEWAY_URL:-http://127.0.0.1:8080}
    volumes:
      - ./data:/app/data
      - ./config:/app/config
      - ./reports:/app/data/reports
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 4G
          cpus: "2.0"

  openclaw-orchestrator:
    build:
      context: ./openclaw/orchestrator
      dockerfile: Dockerfile
    container_name: openclaw-orchestrator
    ports:
      - "8080:8080"
    environment:
      - NODE_ENV=production
    depends_on:
      - platform-osint
    restart: unless-stopped

  hermes-webui:
    build:
      context: ./hermes-webui
      dockerfile: Dockerfile
    container_name: hermes-webui
    ports:
      - "3000:3000"
    environment:
      - HERMES_WEBUI_HOST=0.0.0.0
      - HERMES_WEBUI_PORT=3000
    depends_on:
      - platform-osint
    restart: unless-stopped

  database:
    image: sqlite:latest
    container_name: platforme-db
    volumes:
      - ./data:/data
    restart: unless-stopped

volumes:
  data:
  reports: